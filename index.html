.mara-head{display:flex;align-items:center;gap:12px}
.mara-status{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:5px;font-size:.72rem;color:var(--mu)}.mara-status .dot{width:7px;height:7px;border-radius:50%;background:var(--ok);display:inline-block}.mara-status .dot.net{background:#3d8bff}.mara-status .dot.off{background:#8b97ab}.mara-status button{border:1px solid var(--bd);background:var(--el);color:var(--fg);border-radius:99px;padding:4px 9px;font:inherit;font-size:.72rem}

/* Carte humeur/tâches en flip, comme deux pages d’un même carnet : on choisit
   la face avec le petit sélecteur du haut, et la carte se retourne au lieu
   d’empiler les deux blocs l’un sous l’autre. */
.flip-card{overflow:hidden;perspective:1400px}
.flip-seg{display:flex;gap:6px;margin-bottom:14px}
.flip-seg button{flex:1;display:flex;align-items:center;justify-content:center;gap:6px;height:38px;border-radius:14px;border:1px solid var(--bd);background:var(--el);color:var(--mu);font:500 .8rem Outfit,system-ui;cursor:pointer;padding:0 4px}
.flip-seg button svg{width:15px;height:15px;flex:none}
.flip-seg button.a{background:color-mix(in srgb,var(--pr) 18%,transparent);border-color:var(--pr);color:var(--fg)}
.flip-inner{position:relative;transition:transform .55s cubic-bezier(.4,.15,.2,1);transform-style:preserve-3d}
.flip-inner.flipped{transform:rotateY(180deg)}
.flip-face{backface-visibility:hidden;-webkit-backface-visibility:hidden}
.flip-face.flip-back{position:absolute;inset:0;transform:rotateY(180deg);overflow:auto}
.flip-inner:not(.flipped) .flip-back{pointer-events:none}
.flip-inner.flipped .flip-front{pointer-events:none}
@media(prefers-reduced-motion:reduce){.flip-inner{transition:none!important}}
.chat-tools{display:flex;gap:7px;margin-top:8px}.chat-tools label{flex:1;display:block}
.chat-tools button{width:100%;height:40px;border:1px solid var(--bd);background:var(--el);color:var(--fg);border-radius:13px;font:inherit;font-size:.78rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}.chat-tools button svg{width:15px;height:15px}
.chat-tools button.rec{color:var(--dg);border-color:var(--dg)}
.attach-preview{display:flex;align-items:center;gap:10px;margin-top:8px;padding:8px;border:1px solid var(--bd);border-radius:14px;background:var(--el)}
.attach-preview img{width:46px;height:46px;object-fit:cover;border-radius:10px;flex:none}.attach-preview span{font-size:.78rem;color:var(--mu)}.attach-preview button{background:none;border:0;color:var(--mu);margin-left:auto;padding:4px}
/* Ajustements mobiles Mara : conversation compacte, composeur en bas */
.mara-screen{display:flex;flex:1;flex-direction:column;gap:8px;min-height:0;height:100%;}
.mara-screen .mara-top{flex:none;padding:2px 2px 6px}
.mara-screen .mara-thread{display:flex;flex:1;flex-direction:column;min-height:0;gap:0}
.mara-screen .chat{flex:1;min-height:90px;max-height:none;margin-top:0;overflow-y:auto;overscroll-behavior:contain;padding:4px 0 8px;}
.mara-screen .cin{margin-top:7px;gap:7px;flex:none}
.mara-screen .cin input{min-width:0;height:50px;}
.mara-screen .chat-tools{margin-top:6px;gap:7px;flex:none}
.mara-screen .chat-tools label.chat-image-pick{flex:0 0 44px;width:44px;height:40px;border:1px solid var(--bd);background:var(--el);border-radius:13px;display:grid;place-items:center;color:var(--fg);padding:0;margin:0;overflow:hidden;font-size:0}
.mara-screen .chat-tools label.chat-image-pick svg{width:19px;height:19px}
.mara-screen .chat-tools button{flex:1;min-width:0;height:40px}
.mara-screen .mara-breathe{margin-top:8px;height:44px;flex:none}
.mara-screen .br{height:100px}
body:has(.mara-screen) main{height:calc(100dvh - 78px - env(safe-area-inset-bottom,0px));min-height:0;overflow:hidden;padding:10px 12px 6px;}
body:has(.mara-screen) nav{z-index:6}
body.chat-keyboard nav{display:none}
body.chat-keyboard:has(.mara-screen) main{height:calc(100dvh - env(safe-area-inset-top,0px));padding-bottom:6px}
body.chat-keyboard .mara-screen .mara-breathe{display:none}
.chat-delete-overlay{position:fixed;inset:0;z-index:10000;background:rgba(3,7,18,.72);display:flex;align-items:center;justify-content:center;padding:18px}
.chat-delete-dialog{width:min(100%,390px);background:var(--s);border:1px solid var(--bd);border-radius:22px;padding:20px;box-shadow:var(--sh)}
.chat-delete-dialog p{color:var(--mu);font-size:.9rem;margin-top:6px}
.chat-delete-actions{display:grid;gap:8px;margin-top:16px}
.chat-delete-actions button{margin:0}
@media(max-height:520px){.mara-screen .mara-top .mara-avatar{width:36px;height:36px}.mara-screen .mara-top h1{font-size:1.35rem!important}.mara-screen .mara-top .mara-status{margin-top:2px}.mara-screen .mara-breathe{height:38px}}
